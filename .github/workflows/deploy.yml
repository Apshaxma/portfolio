name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The deployed bundle needs the public Convex endpoint. This URL is
      # public — it ships inside the client bundle anyway — so it is baked in
      # here instead of requiring a repository secret.
      - name: Write build environment
        run: |
          echo "VITE_CONVEX_URL=https://majestic-wildcat-199.convex.cloud" > .env.local

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:gh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
