<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #00f5d4;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 14px;
      }
    </style>
    <script>
      // GitHub Pages SPA fallback: rewrite any unknown path to the app root
      // so client-side routing (e.g. /resume) works on the free domain.
      sessionStorage.setItem("gh-pages-redirect", location.pathname + location.search);
      location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
